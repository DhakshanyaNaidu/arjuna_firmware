; ============================================================
; ARJUNA Mesh Communicator — PlatformIO v4.0
; Board : Heltec WiFi LoRa 32 V3 (ESP32-S3FN8, SX1262)
; Baud  : 115200
;
; v4.0 fixes over v3.1:
;   - ARDUINO_USB_CDC_ON_BOOT=0  (Heltec V3 uses CP2102, NOT native USB)
;     v3.1 had =1 which caused upload/boot issues with CP2102
;   - RadioLib pinned to ^7.1.2  (stable, matches known-working API)
;   - Added RTClib (DS3231) for hardware RTC — time survives power loss
;   - Removed -flto (GCC 8.4 LTO plugin issue on Windows)
;   - PSRAM disabled via build_flags only (memory_type line removed to
;     keep Arduino framework, not IDF mode)
;   - upload_speed kept at 460800 (reliable on CP2102)
; ============================================================

[env:heltec_wifi_lora_32_V3]
platform  = espressif32 @ ^6.5.0
board     = heltec_wifi_lora_32_V3
framework = arduino

; --- Flash -----------------------------------------------
board_build.flash_mode = dio
board_build.f_flash    = 80000000L
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

; --- Build flags -----------------------------------------
build_flags =
    ; CP2102 serial — NOT native USB CDC
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -Os
    ; PSRAM disabled (belt-and-suspenders, all layers)
    -DBOARD_HAS_PSRAM=0
    -DCONFIG_SPIRAM_SUPPORT=0
    -DCONFIG_ESP32S3_SPIRAM_SUPPORT=0
    -DCONFIG_SPIRAM_USE_MALLOC=0
    ; Tell RadioLib SX1262 driver to use DIO2 as RF switch
    -DSX126X_DIO2_AS_RF_SWITCH=1

; --- Upload & Monitor ------------------------------------
monitor_speed   = 115200
upload_speed    = 460800
monitor_filters = esp32_exception_decoder

; --- Dependencies ----------------------------------------
lib_deps =
    jgromes/RadioLib @ ^7.1.2
    rweather/Crypto @ ^0.4.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    Chris--A/Keypad @ ^3.1.1
    adafruit/RTClib @ ^2.1.4
